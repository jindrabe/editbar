<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1280px;
    height: 640px;
    background:
      radial-gradient(circle at 18% 20%, rgba(120,170,255,0.35), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,140,120,0.28), transparent 40%),
      radial-gradient(circle at 70% 85%, rgba(120,255,180,0.22), transparent 45%),
      linear-gradient(135deg, #0b0c10, #15171c 60%, #0b0c10);
  }
  .mock-page {
    position: absolute;
    top: 90px;
    left: 90px;
    width: 900px;
    color: #eceef2;
  }
  .mock-page h1 {
    font-size: 56px;
    font-weight: 800;
    margin: 0 0 18px 0;
    letter-spacing: -0.02em;
  }
  .mock-page p {
    font-size: 22px;
    line-height: 1.5;
    color: rgba(236,238,242,0.55);
    margin: 0 0 10px 0;
    max-width: 700px;
  }
  .cta {
    display: inline-block;
    margin-top: 26px;
    padding: 14px 26px;
    border-radius: 12px;
    background: #0a84ff;
    color: white;
    font-weight: 700;
    font-size: 18px;
  }
  .bar {
    position: absolute;
    left: 90px;
    bottom: 90px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px) saturate(1.8);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.14),
      inset 0 1px 0 rgba(255,255,255,0.3),
      0 20px 60px rgba(0,0,0,0.5);
    font-size: 22px;
    color: #f2f2f7;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #ff9f0a;
    margin: 0 8px 0 12px;
    box-shadow: 0 0 0 5px rgba(255,159,10,0.2);
  }
  .bar button {
    padding: 12px 22px;
    border-radius: 22px;
    font-size: 22px;
    font-weight: 600;
    color: inherit;
    border: none;
  }
  .bar .primary {
    background: #0a84ff;
    color: white;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .bar .divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.18);
    margin: 0 6px;
  }
  .wordmark {
    position: absolute;
    top: 56px;
    right: 90px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .wordmark .logo-dot {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #0a84ff, #6ec3ff);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .wordmark span {
    font-size: 26px;
    font-weight: 800;
    color: #eceef2;
    letter-spacing: -0.01em;
  }
  .tagline {
    position: absolute;
    bottom: 56px;
    right: 90px;
    max-width: 380px;
    text-align: right;
    font-size: 18px;
    color: rgba(236,238,242,0.5);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="wordmark"><div class="logo-dot"></div><span>Editbar</span></div>

    <div class="mock-page">
      <h1>Welcome to Acme Studio</h1>
      <p>We design and build websites that customers actually enjoy using.</p>
      <p>Edit any text on this page directly — no code, no CMS.</p>
      <div class="cta">Get in touch</div>
    </div>

    <div class="bar">
      <span class="dot"></span>
      <span style="padding:0 14px 0 2px;">Edit</span>
      <button class="primary">Save changes</button>
      <div class="divider"></div>
      <span style="padding:0 16px; opacity:0.7;">✕</span>
    </div>

    <div class="tagline">Edit any website's text in place.<br>Open-source. No CMS. Any framework.</div>
  </div>
</body>
</html>
